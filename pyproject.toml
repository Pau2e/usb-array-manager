[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-array-manager"
version = "0.7.1"
description = "USB storage inventory and safe Windows Storage Spaces backend evaluation"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.scripts]
usb-array-detect = "usb_array_manager.__main__:main"
usb-array-manager = "usb_array_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]
